[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jauto-profiler"
version = "0.2"
requires-python = ">=3.10"
dependencies = ["mcp"]

[project.scripts]
jauto-prof = "jauto_profiler.jauto_prof_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jauto_profiler*"]
